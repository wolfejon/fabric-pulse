<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Fabric Pulse — Microsoft Fabric social listening</title>
    <meta
      name="description"
      content="Demo social-listening and sentiment dashboard for Microsoft Fabric product teams."
    />
    <script>
      try {
        var t = localStorage.getItem('fabric-pulse-theme')
        var ok = {
          pulse: 1,
          fluent: 1,
          paper: 1,
          ops: 1,
          glass: 1,
          narrative: 1,
          enterprise: 1,
          radar: 1,
        }
        document.documentElement.setAttribute('data-theme', ok[t] ? t : 'pulse')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'pulse')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
